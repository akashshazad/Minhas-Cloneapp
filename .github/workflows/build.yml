name: Build DualClone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        run: |
          curl -L "https://muse.ai/files/1329763656894510/1382012220385990/j5mc0lix3vrw1dc20c0z65gh/DualClone-integrated.zip" -o project.zip
          unzip -q project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: DualClone
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualClone-debug-APK
          path: DualClone/app/build/outputs/apk/debug/app-debug.apk
